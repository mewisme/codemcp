<svg xmlns="http://www.w3.org/2000/svg" width="1460" height="800" viewBox="0 0 1460 800" role="img" aria-labelledby="title desc">
  <title id="title">CodeMCP System Overview</title>
  <desc id="desc">OpenAI and generic MCP clients connect through profile projection into one local CodeMCP runtime, which owns workspace scope, execution, state, integrations, and upstream MCP aggregation.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 L10 5 L0 10 z" fill="#0f766e"/>
    </marker>
    <style>
      .bg{fill:#f8fafc}.frame{fill:#fff;stroke:#cbd5e1;stroke-width:1.5}.boundary{fill:#f1f5f9;fill-opacity:.45;stroke:#94a3b8;stroke-width:1.5;stroke-dasharray:7 6}.security-boundary{fill:#ecfeff;fill-opacity:.45;stroke:#0f766e;stroke-width:1.7;stroke-dasharray:6 5}
      .node{fill:#fff;stroke:#94a3b8;stroke-width:1.4;rx:12}.node-cloud{fill:#eff6ff;stroke:#3b82f6}.node-security{fill:#ecfeff;stroke:#0f766e}.node-backend{fill:#f8fafc;stroke:#64748b}.node-db{fill:#faf5ff;stroke:#8b5cf6}.node-external{fill:#fff7ed;stroke:#f59e0b}.node-frontend{fill:#f0fdf4;stroke:#22c55e}
      .label{font:600 14px Inter,ui-sans-serif,system-ui,sans-serif;fill:#0f172a}.sub{font:11px Inter,ui-sans-serif,system-ui,sans-serif;fill:#475569}.tag{font:600 9px Inter,ui-sans-serif,system-ui,sans-serif;fill:#64748b;letter-spacing:.06em}.boundary-label{font:600 12px Inter,ui-sans-serif,system-ui,sans-serif;fill:#475569}
      .edge{fill:none;stroke:#64748b;stroke-width:1.6;marker-end:url(#arrow)}.edge-accent{stroke:#0f766e;stroke-width:2;marker-end:url(#arrow-accent)}.edge-dashed{stroke-dasharray:6 5}.edge-label{font:10px Inter,ui-sans-serif,system-ui,sans-serif;fill:#64748b}
      .card{fill:#fff;stroke:#e2e8f0;rx:10}.card-title{font:600 12px Inter,ui-sans-serif,system-ui,sans-serif;fill:#0f172a}.card-text{font:10px Inter,ui-sans-serif,system-ui,sans-serif;fill:#475569}
    </style>
  </defs>
  <rect class="bg" width="1460" height="800"/>

  <rect class="boundary" x="464" y="26" width="782" height="602" rx="20"/>
  <text class="boundary-label" x="482" y="49">Your machine</text>
  <rect class="security-boundary" x="982" y="112" width="246" height="310" rx="18"/>
  <text class="boundary-label" x="1000" y="136">Workspace execution boundary</text>

  <path class="edge edge-accent" d="M185 158 H245"/>
  <text class="edge-label" x="207" y="149">MCP</text>
  <path class="edge edge-accent" d="M435 163 H470 Q485 163 485 178 V225 H500"/>
  <text class="edge-label" x="443" y="151">OpenAI profile</text>
  <path class="edge" d="M185 363 H460 Q480 363 480 343 V301 H500"/>
  <text class="edge-label" x="275" y="352">stdio / HTTP</text>
  <path class="edge edge-accent" d="M680 263 H750"/>
  <text class="edge-label" x="691" y="251">canonical operations</text>
  <path class="edge" d="M837 127 V225"/>
  <text class="edge-label" x="845" y="183">operate</text>
  <path class="edge edge-accent" d="M925 246 H968 Q990 246 990 217 H1010"/>
  <text class="edge-label" x="936" y="234">scope</text>
  <path class="edge" d="M925 285 H1010"/>
  <text class="edge-label" x="944" y="274">dispatch</text>
  <path class="edge edge-accent" d="M1105 217 V300"/>
  <text class="edge-label" x="1114" y="265">authorize</text>
  <path class="edge" d="M837 307 V505"/>
  <text class="edge-label" x="845" y="414">persist</text>
  <path class="edge" d="M925 303 H960 Q986 303 986 518 H1010"/>
  <text class="edge-label" x="946" y="315">extend</text>
  <path class="edge edge-dashed" d="M1200 518 H1260"/>
  <text class="edge-label" x="1209" y="507">semantic / inference</text>
  <path class="edge edge-dashed" d="M1200 338 H1260"/>
  <text class="edge-label" x="1212" y="327">aggregate MCP</text>

  <g transform="translate(35 125)">
    <rect class="node node-external" width="150" height="66"/>
    <text class="label" x="75" y="27" text-anchor="middle">ChatGPT</text>
    <text class="sub" x="75" y="46" text-anchor="middle">OpenAI MCP client</text>
  </g>
  <g transform="translate(35 330)">
    <rect class="node node-external" width="150" height="66"/>
    <text class="label" x="75" y="27" text-anchor="middle">MCP Clients</text>
    <text class="sub" x="75" y="46" text-anchor="middle">Claude · Cursor · agents</text>
  </g>
  <g transform="translate(245 125)">
    <rect class="node node-cloud" width="190" height="76"/>
    <text class="label" x="95" y="30" text-anchor="middle">OpenAI Secure MCP Tunnel</text>
    <text class="sub" x="95" y="51" text-anchor="middle">outbound-only transport</text>
  </g>
  <g transform="translate(500 225)">
    <rect class="node node-security" width="180" height="76"/>
    <text class="label" x="90" y="28" text-anchor="middle">MCP Profile Projection</text>
    <text class="sub" x="90" y="48" text-anchor="middle">OpenAI first · Base generic</text>
  </g>
  <g transform="translate(750 225)">
    <rect class="node node-backend" width="175" height="82"/>
    <text class="tag" x="87.5" y="18" text-anchor="middle">GO BINARY</text>
    <text class="label" x="87.5" y="43" text-anchor="middle">CodeMCP Runtime</text>
    <text class="sub" x="87.5" y="63" text-anchor="middle">single local authority</text>
  </g>
  <g transform="translate(735 55)">
    <rect class="node node-frontend" width="205" height="72"/>
    <text class="label" x="102.5" y="29" text-anchor="middle">Local Control Surfaces</text>
    <text class="sub" x="102.5" y="49" text-anchor="middle">CLI · TUI · Admin · Telegram</text>
  </g>
  <g transform="translate(1010 145)">
    <rect class="node node-security" width="190" height="72"/>
    <text class="label" x="95" y="29" text-anchor="middle">Registered Workspaces</text>
    <text class="sub" x="95" y="49" text-anchor="middle">explicit ws_* scopes</text>
  </g>
  <g transform="translate(1010 300)">
    <rect class="node node-backend" width="190" height="76"/>
    <text class="label" x="95" y="30" text-anchor="middle">Execution &amp; Tools</text>
    <text class="sub" x="95" y="51" text-anchor="middle">filesystem · shell · Git · process</text>
  </g>
  <g transform="translate(735 505)">
    <rect class="node node-db" width="205" height="76"/>
    <text class="label" x="102.5" y="30" text-anchor="middle">Local State</text>
    <text class="sub" x="102.5" y="51" text-anchor="middle">config · secrets · history · memory</text>
  </g>
  <g transform="translate(1010 480)">
    <rect class="node node-backend" width="190" height="76"/>
    <text class="label" x="95" y="30" text-anchor="middle">Integrations</text>
    <text class="sub" x="95" y="51" text-anchor="middle">RTK · CodeGraph · TypeSafe · CF</text>
  </g>
  <g transform="translate(1260 480)">
    <rect class="node node-external" width="170" height="76"/>
    <text class="label" x="85" y="30" text-anchor="middle">LLM / Semantic Providers</text>
    <text class="sub" x="85" y="51" text-anchor="middle">Ollama · SystemOne</text>
  </g>
  <g transform="translate(1260 300)">
    <rect class="node node-external" width="170" height="76"/>
    <text class="label" x="85" y="30" text-anchor="middle">Upstream MCP Servers</text>
    <text class="sub" x="85" y="51" text-anchor="middle">optional aggregated tools</text>
  </g>

  <g transform="translate(40 665)">
    <rect class="card" width="430" height="104"/>
    <text class="card-title" x="18" y="25">OpenAI-first path</text>
    <text class="card-text" x="18" y="48">• ChatGPT connects through OpenAI Secure MCP Tunnel.</text>
    <text class="card-text" x="18" y="66">• OpenAI profile changes projection, not authorization authority.</text>
    <text class="card-text" x="18" y="84">• No public inbound MCP port is required for the default path.</text>
  </g>
  <g transform="translate(515 665)">
    <rect class="card" width="430" height="104"/>
    <text class="card-title" x="18" y="25">Workspace boundary</text>
    <text class="card-text" x="18" y="48">• Filesystem, shell, Git, and process work targets registered workspaces.</text>
    <text class="card-text" x="18" y="66">• Control guards and approvals remain local.</text>
    <text class="card-text" x="18" y="84">• Managed secrets stay outside ordinary structured config.</text>
  </g>
  <g transform="translate(990 665)">
    <rect class="card" width="430" height="104"/>
    <text class="card-title" x="18" y="25">One runtime, optional extensions</text>
    <text class="card-text" x="18" y="48">• CLI, TUI, Admin, and Telegram use the same application services.</text>
    <text class="card-text" x="18" y="66">• RTK, CodeGraph, TypeSafe, and upstream MCP extend the same runtime.</text>
    <text class="card-text" x="18" y="84">• Base remains available for generic MCP clients.</text>
  </g>
</svg>
