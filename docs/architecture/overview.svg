<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560" role="img" aria-labelledby="title desc">
  <title id="title">CodeMCP overview</title>
  <desc id="desc">ChatGPT connects through OpenAI Secure MCP Tunnel to a local CodeMCP runtime. The runtime operates on explicitly registered workspaces, workspace-bound filesystem shell and Git tools, optional upstream MCP servers, and local CLI TUI and Admin control surfaces.</desc>
  <style>
    :root { color-scheme: light dark; }
    .bg { fill: #ffffff; }
    .panel { fill: #f8fafc; stroke: #cbd5e1; }
    .node { fill: #ffffff; stroke: #94a3b8; }
    .node-main { fill: #eff6ff; stroke: #3b82f6; }
    .node-secure { fill: #ecfdf5; stroke: #10b981; }
    .node-cloud { fill: #f5f3ff; stroke: #8b5cf6; }
    .node-muted { fill: #f8fafc; stroke: #cbd5e1; }
    .text { fill: #0f172a; font: 600 15px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .sub { fill: #64748b; font: 12px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .label { fill: #475569; font: 11px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .boundary { fill: none; stroke: #94a3b8; stroke-dasharray: 6 6; }
    .flow { fill: none; stroke: #64748b; stroke-width: 1.7; marker-end: url(#arrow); }
    .flow-main { stroke: #2563eb; stroke-width: 2.2; }
    .flow-optional { stroke-dasharray: 5 5; }
    .badge { fill: #dbeafe; }
    .badge-text { fill: #1d4ed8; font: 600 10px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0b1120; }
      .panel { fill: #0f172a; stroke: #334155; }
      .node { fill: #111827; stroke: #64748b; }
      .node-main { fill: #172554; stroke: #60a5fa; }
      .node-secure { fill: #052e2b; stroke: #34d399; }
      .node-cloud { fill: #2e1065; stroke: #a78bfa; }
      .node-muted { fill: #111827; stroke: #475569; }
      .text { fill: #f8fafc; }
      .sub, .label { fill: #94a3b8; }
      .boundary { stroke: #475569; }
      .flow { stroke: #94a3b8; }
      .flow-main { stroke: #60a5fa; }
      .badge { fill: #1e3a8a; }
      .badge-text { fill: #bfdbfe; }
    }
  </style>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect class="bg" width="1120" height="560" rx="18"/>

  <text class="text" x="36" y="38" font-size="18">Default ChatGPT path</text>
  <text class="sub" x="36" y="60">Private tunnel first; direct HTTP is optional.</text>

  <rect class="node" x="36" y="116" width="150" height="72" rx="12"/>
  <text class="text" x="111" y="145" text-anchor="middle">ChatGPT</text>
  <text class="sub" x="111" y="166" text-anchor="middle">MCP client</text>

  <rect class="node-cloud" x="246" y="106" width="218" height="92" rx="12"/>
  <text class="text" x="355" y="139" text-anchor="middle">OpenAI Secure MCP Tunnel</text>
  <text class="sub" x="355" y="161" text-anchor="middle">default private transport</text>
  <rect class="badge" x="306" y="172" width="98" height="18" rx="9"/>
  <text class="badge-text" x="355" y="185" text-anchor="middle">OUTBOUND ONLY</text>

  <rect class="panel" x="520" y="78" width="564" height="390" rx="18"/>
  <text class="label" x="544" y="104">YOUR MACHINE</text>

  <rect class="node-main" x="556" y="116" width="190" height="84" rx="12"/>
  <text class="text" x="651" y="149" text-anchor="middle">CodeMCP</text>
  <text class="sub" x="651" y="171" text-anchor="middle">local runtime · single binary</text>

  <rect class="boundary" x="790" y="104" width="258" height="206" rx="16"/>
  <text class="label" x="810" y="128">WORKSPACE BOUNDARY</text>

  <rect class="node-secure" x="814" y="144" width="210" height="64" rx="11"/>
  <text class="text" x="919" y="171" text-anchor="middle">Registered Workspaces</text>
  <text class="sub" x="919" y="191" text-anchor="middle">explicit ws_* scopes</text>

  <rect class="node-secure" x="814" y="226" width="210" height="64" rx="11"/>
  <text class="text" x="919" y="253" text-anchor="middle">Filesystem / Shell / Git</text>
  <text class="sub" x="919" y="273" text-anchor="middle">workspace-bound tools</text>

  <rect class="node-muted" x="814" y="338" width="210" height="64" rx="11"/>
  <text class="text" x="919" y="365" text-anchor="middle">Upstream MCP Servers</text>
  <text class="sub" x="919" y="385" text-anchor="middle">optional aggregation</text>

  <rect class="node" x="556" y="338" width="190" height="64" rx="11"/>
  <text class="text" x="651" y="365" text-anchor="middle">CLI / TUI / Admin</text>
  <text class="sub" x="651" y="385" text-anchor="middle">local control surfaces</text>

  <path class="flow flow-main" d="M186 152 H246"/>
  <text class="label" x="216" y="140" text-anchor="middle">MCP</text>
  <path class="flow flow-main" d="M464 152 H556"/>
  <text class="label" x="510" y="140" text-anchor="middle">secure tunnel</text>

  <path class="flow" d="M746 145 H780 Q790 145 790 155 V176 H814"/>
  <text class="label" x="780" y="136" text-anchor="end">workspace_id</text>
  <path class="flow" d="M746 171 H776 Q790 171 790 185 V258 H814"/>
  <text class="label" x="779" y="215" text-anchor="end">scoped tools</text>
  <path class="flow flow-optional" d="M746 188 H770 Q782 188 782 200 V370 H814"/>
  <text class="label" x="774" y="326" text-anchor="end">proxy</text>
  <path class="flow" d="M651 338 V200"/>
  <text class="label" x="663" y="282">operate locally</text>

  <line x1="36" y1="496" x2="1084" y2="496" stroke="#cbd5e1"/>
  <circle cx="48" cy="526" r="5" fill="#2563eb"/>
  <text class="sub" x="62" y="530">No public inbound MCP port required for the default ChatGPT setup.</text>
  <circle cx="462" cy="526" r="5" fill="#10b981"/>
  <text class="sub" x="476" y="530">Local capabilities stay inside explicitly registered workspace scope.</text>
</svg>
