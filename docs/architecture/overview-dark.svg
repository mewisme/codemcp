<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="660" viewBox="0 0 1220 660" role="img" aria-labelledby="title desc">
<title id="title">CodeMCP — System Overview</title>
<desc id="desc">AI agents connect through the MCP server into the canonical CodeMCP tool runtime, which is constrained by workspace scope, instruction context, approvals, local services, Telegram, and managed integrations.</desc>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L10 5 L0 10 z" fill="#64748b"/></marker>
  <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L10 5 L0 10 z" fill="#34d399"/></marker>
  <style>
    .bg{fill:#020617}.boundary{fill:#0f172a;fill-opacity:.35;stroke:#334155;stroke-width:1.5;stroke-dasharray:7 6}
    .node{fill:#0f172a;stroke:#475569;stroke-width:1.4}.backend{fill:#062e2a;stroke:#34d399}.security{fill:#3b1020;stroke:#fb7185}.frontend{fill:#082f49;stroke:#38bdf8}.external{fill:#1e293b;stroke:#94a3b8}
    .title{font:700 20px Inter,ui-sans-serif,system-ui,sans-serif;fill:#f8fafc}.label{font:600 13px Inter,ui-sans-serif,system-ui,sans-serif;fill:#f8fafc}.sub{font:10px Inter,ui-sans-serif,system-ui,sans-serif;fill:#94a3b8}.edge-label{font:9px Inter,ui-sans-serif,system-ui,sans-serif;fill:#cbd5e1}.boundary-label{font:600 11px Inter,ui-sans-serif,system-ui,sans-serif;fill:#94a3b8}
    .edge{fill:none;stroke:#64748b;stroke-width:1.5;marker-end:url(#arrow)}.accent{stroke:#34d399;stroke-width:1.9;marker-end:url(#arrow-accent)}.dash{stroke-dasharray:6 5}
    .mask{fill:#020617;fill-opacity:.92}.card{fill:#0f172a;stroke:#334155}.card-title{font:600 11px Inter,ui-sans-serif,system-ui,sans-serif;fill:#f8fafc}.card-text{font:9px Inter,ui-sans-serif,system-ui,sans-serif;fill:#cbd5e1}
  </style>
</defs>
<rect class="bg" width="1220" height="660"/>
<text class="title" x="40" y="34">CodeMCP — System Overview</text>
<rect class="boundary" x="220" y="44" width="745" height="566" rx="20"/>
<text class="boundary-label" x="238" y="64">CodeMCP trust boundary</text>

<path class="edge accent" d="M190 321 H260"/><path class="edge accent" d="M410 321 H500"/><path class="edge accent" d="M660 321 H750"/><path class="edge accent" d="M920 321 H1010"/>
<path class="edge" d="M588 152 V285"/><path class="edge" d="M838 152 V238 H660 V285"/>
<path class="edge" d="M190 536 H270"/><path class="edge" d="M350 500 V430 H548 V357"/>
<path class="edge dash" d="M580 357 V428 H588 V500"/><path class="edge" d="M838 500 V428 H612 V357"/>

<rect class="mask" x="204" y="305" width="52" height="15" rx="3"/><text class="edge-label" x="230" y="316" text-anchor="middle">MCP</text>
<rect class="mask" x="427" y="296" width="122" height="15" rx="3"/><text class="edge-label" x="488" y="307" text-anchor="middle">typed tools / resources</text>
<rect class="mask" x="680" y="305" width="96" height="15" rx="3"/><text class="edge-label" x="728" y="316" text-anchor="middle">bound execution</text>
<rect class="mask" x="931" y="296" width="106" height="15" rx="3"/><text class="edge-label" x="984" y="307" text-anchor="middle">filesystem / shell</text>
<rect class="mask" x="527" y="211" width="122" height="15" rx="3"/><text class="edge-label" x="588" y="222" text-anchor="middle">context + workflows</text>
<rect class="mask" x="678" y="226" width="135" height="15" rx="3"/><text class="edge-label" x="745" y="237" text-anchor="middle">authorize gated actions</text>
<rect class="mask" x="185" y="577" width="145" height="15" rx="3"/><text class="edge-label" x="258" y="588" text-anchor="middle">install / serve / restart</text>
<rect class="mask" x="398" y="416" width="98" height="15" rx="3"/><text class="edge-label" x="447" y="427" text-anchor="middle">managed backend</text>
<rect class="mask" x="640" y="383" width="132" height="15" rx="3"/><text class="edge-label" x="706" y="394" text-anchor="middle">notifications / approvals</text>
<rect class="mask" x="650" y="440" width="154" height="15" rx="3"/><text class="edge-label" x="727" y="451" text-anchor="middle">local integration capabilities</text>

<g transform="translate(40 285)"><rect class="node external" width="150" height="72" rx="10"/><text class="label" x="75" y="31" text-anchor="middle">AI Agents</text><text class="sub" x="75" y="49" text-anchor="middle">ChatGPT / Claude / clients</text></g>
<g transform="translate(260 285)"><rect class="node backend" width="150" height="72" rx="10"/><text class="label" x="75" y="31" text-anchor="middle">MCP Server</text><text class="sub" x="75" y="49" text-anchor="middle">Base + OpenAI profiles</text></g>
<g transform="translate(500 285)"><rect class="node backend" width="160" height="72" rx="10"/><text class="label" x="80" y="31" text-anchor="middle">Tool Runtime</text><text class="sub" x="80" y="49" text-anchor="middle">Canonical feature execution</text></g>
<g transform="translate(750 285)"><rect class="node security" width="170" height="72" rx="10"/><text class="label" x="85" y="31" text-anchor="middle">Workspace Boundary</text><text class="sub" x="85" y="49" text-anchor="middle">Bound workspace + permissions</text></g>
<g transform="translate(1010 285)"><rect class="node external" width="170" height="72" rx="10"/><text class="label" x="85" y="31" text-anchor="middle">Host Machine</text><text class="sub" x="85" y="49" text-anchor="middle">Filesystem / shell / local tools</text></g>

<g transform="translate(500 80)"><rect class="node backend" width="175" height="72" rx="10"/><text class="label" x="87.5" y="31" text-anchor="middle">Instruction Context</text><text class="sub" x="87.5" y="49" text-anchor="middle">Rules / Skills / Plans / Memory</text></g>
<g transform="translate(750 80)"><rect class="node security" width="175" height="72" rx="10"/><text class="label" x="87.5" y="31" text-anchor="middle">Approval &amp; Semantics</text><text class="sub" x="87.5" y="49" text-anchor="middle">Fail-closed gated actions</text></g>

<g transform="translate(40 500)"><rect class="node frontend" width="150" height="72" rx="10"/><text class="label" x="75" y="31" text-anchor="middle">cm CLI / TUI</text><text class="sub" x="75" y="49" text-anchor="middle">Local control surface</text></g>
<g transform="translate(270 500)"><rect class="node backend" width="160" height="72" rx="10"/><text class="label" x="80" y="31" text-anchor="middle">Managed Service</text><text class="sub" x="80" y="49" text-anchor="middle">Runtime lifecycle + tunnel</text></g>
<g transform="translate(500 500)"><rect class="node external" width="175" height="72" rx="10"/><text class="label" x="87.5" y="31" text-anchor="middle">Telegram</text><text class="sub" x="87.5" y="49" text-anchor="middle">Topics / approvals / notifications</text></g>
<g transform="translate(750 500)"><rect class="node backend" width="175" height="72" rx="10"/><text class="label" x="87.5" y="31" text-anchor="middle">Managed Integrations</text><text class="sub" x="87.5" y="49" text-anchor="middle">rtk / codegraph / cf</text></g>

<g transform="translate(40 620)"><rect class="card" width="350" height="28" rx="8"/><text class="card-title" x="12" y="18">Request path</text><text class="card-text" x="100" y="18">Agent → MCP → Runtime → Workspace → Machine</text></g>
<g transform="translate(435 620)"><rect class="card" width="350" height="28" rx="8"/><text class="card-title" x="12" y="18">Policy</text><text class="card-text" x="68" y="18">Rules, Skills, Plans and approvals feed runtime behavior</text></g>
<g transform="translate(830 620)"><rect class="card" width="350" height="28" rx="8"/><text class="card-title" x="12" y="18">Operations</text><text class="card-text" x="88" y="18">CLI/TUI, service, Telegram and integrations share one runtime</text></g>
</svg>
