# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: codemcp

before:
  hooks:
    - go mod verify

builds:
  - id: codemcp
    main: .
    binary: cm
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags:
      - -s -w
      - -X go.mewis.me/codemcp/internal/version.ReleaseTag={{.Tag}}
      - -X go.mewis.me/codemcp/internal/version.Commit={{.Commit}}
      - -X go.mewis.me/codemcp/internal/version.Date={{.Date}}
      - -X go.mewis.me/codemcp/internal/telemetry/product.Endpoint={{ index .Env "TELEMETRY_ENDPOINT" }}
    hooks:
      post:
        - cmd: 'sh scripts/release/build-windows-setup.sh "{{ .Path }}" "{{ .Target }}" dist "{{ .Version }}"'
          output: true

# Keep macOS binaries untouched for Gatekeeper compatibility.
upx:
  - enabled: true
    ids: [codemcp]
    goos: [linux, windows]
    compress: best

archives:
  - id: codemcp
    formats: [tar.gz]
    files:
      - LICENSE
      - README.md
      - third_party/ponytail/LICENSE
      - third_party/ponytail/NOTICE.md
      - third_party/caveman/LICENSE
      - third_party/caveman/NOTICE.md
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"

nfpms:
  - id: codemcp
    ids:
      - codemcp
    formats:
      - deb
      - rpm
    package_name: codemcp
    file_name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}.{{ .Format }}"
    vendor: mewisme
    homepage: "https://github.com/mewisme/codemcp"
    maintainer: '{{ index .Env "PACKAGE_MAINTAINER" }}'
    description: "A secure, workspace-bound MCP bridge connecting ChatGPT, Claude, and other AI agents to your machine."
    license: MIT
    section: utils
    priority: optional
    bindir: /usr/bin
    goamd64:
      - v1
    deb:
      compression: gzip
    rpm:
      summary: "A secure, workspace-bound MCP bridge connecting ChatGPT, Claude, and other AI agents to your machine."
      compression: gzip

checksum:
  name_template: codemcp_checksums.txt
  extra_files:
    - glob: ./dist/codemcp_windows_amd64_setup.exe
    - glob: ./dist/codemcp_windows_arm64_setup.exe

signs:
  - id: checksums
    cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - --yes
    artifacts: checksum

snapshot:
  version_template: "{{ incpatch .Version }}-next"

release:
  github:
    owner: mewisme
    name: codemcp
  extra_files:
    - glob: ./dist/codemcp_windows_amd64_setup.exe
    - glob: ./dist/codemcp_windows_arm64_setup.exe
  replace_existing_draft: true

changelog:
  use: git
  sort: asc
  filters:
    exclude:
      - '^chore:'
      - '^docs:'

# Generate dist/scoop/codemcp.json; the release workflow uploads it as
# a release asset and scoop-mew syncs it through repository_dispatch.
scoops:
  - name: codemcp
    ids:
      - codemcp
    url_template: "https://github.com/mewisme/codemcp/releases/download/{{ .Tag }}/{{ .ArtifactName }}"
    homepage: "https://github.com/mewisme/codemcp"
    description: "A secure, workspace-bound MCP bridge connecting ChatGPT, Claude, and other AI agents to your machine."
    license: MIT
    goamd64: v1
    skip_upload: true
    repository:
      owner: mewisme
      name: scoop-mew
      branch: main

# Generate dist/homebrew/Casks/codemcp.rb; the release workflow uploads
# it as a release asset and homebrew-mew syncs it through repository_dispatch.
homebrew_casks:
  - name: codemcp
    ids:
      - codemcp
    binaries:
      - cm
    homepage: "https://github.com/mewisme/codemcp"
    description: "A secure, workspace-bound MCP bridge connecting ChatGPT, Claude, and other AI agents to your machine."
    url:
      template: "https://github.com/mewisme/codemcp/releases/download/{{ .Tag }}/{{ .ArtifactName }}"
    directory: Casks
    skip_upload: true
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/cm"]
          end
    repository:
      owner: mewisme
      name: homebrew-mew
      branch: main
