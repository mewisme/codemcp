name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Change scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      full: ${{ steps.scope.outputs.full }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Classify changes
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_HEAD_SHA: ${{ github.sha }}
        run: |
          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            base="${PR_BASE_SHA}"
            head="${PR_HEAD_SHA}"
          else
            base="${BEFORE_SHA}"
            head="${PUSH_HEAD_SHA}"
          fi

          if [[ -z "${base}" || "${base}" =~ ^0+$ ]] || ! git cat-file -e "${base}^{commit}" || ! git cat-file -e "${head}^{commit}"; then
            echo "full=true" >> "${GITHUB_OUTPUT}"
            echo "No usable comparison range; running full CI."
            exit 0
          fi

          mapfile -t files < <(git diff --name-only "${base}" "${head}")
          full=false
          for file in "${files[@]}"; do
            case "${file}" in
              README.md|CONTRIBUTING.md|CODE_OF_CONDUCT.md|SECURITY.md|docs/*) ;;
              *) full=true; break ;;
            esac
          done
          echo "full=${full}" >> "${GITHUB_OUTPUT}"
          printf 'Changed files (%d):\n' "${#files[@]}"
          printf '  %s\n' "${files[@]}"
          echo "Full CI: ${full}"

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    needs:
      - changes
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Skip heavy checks
        if: needs.changes.outputs.full != 'true'
        working-directory: ${{ github.workspace }}
        run: echo "Documentation-only change; frontend checks skipped."

      - name: Checkout
        if: needs.changes.outputs.full == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        if: needs.changes.outputs.full == 'true'
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11

      - name: Setup Node
        if: needs.changes.outputs.full == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install
        if: needs.changes.outputs.full == 'true'
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        if: needs.changes.outputs.full == 'true'
        run: pnpm audit --prod

      - name: Test with coverage
        if: needs.changes.outputs.full == 'true'
        run: pnpm test:coverage

      - name: Install browser test runtime
        if: needs.changes.outputs.full == 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Interaction and responsive browser gate
        if: needs.changes.outputs.full == 'true'
        run: pnpm test:e2e

      - name: Lint
        if: needs.changes.outputs.full == 'true'
        run: pnpm lint

      - name: Typecheck
        if: needs.changes.outputs.full == 'true'
        run: pnpm typecheck

      - name: Build
        if: needs.changes.outputs.full == 'true'
        run: pnpm build

  security:
    name: Security checks
    runs-on: ubuntu-latest
    needs:
      - changes
    timeout-minutes: 15
    steps:
      - name: Skip heavy checks
        if: needs.changes.outputs.full != 'true'
        run: echo "Documentation-only change; security checks skipped."

      - name: Checkout
        if: needs.changes.outputs.full == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        if: needs.changes.outputs.full == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node
        if: needs.changes.outputs.full == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Prepare frontend fixture
        if: needs.changes.outputs.full == 'true'
        run: |
          mkdir -p internal/interface/web/dist internal/telegram/mini-app-dist/assets
          printf '<!doctype html><html><body>CI</body></html>\n' > internal/interface/web/dist/index.html
          printf '<!doctype html><html><head><script src="https://telegram.org/js/telegram-web-app.js?56"></script></head><body><div data-codemcp-mini-app-root>Loading CodeMCP Mini App</div><script type="module" src="/assets/mini-app.js"></script></body></html>\n' > internal/telegram/mini-app-dist/mini-app.html
          printf 'document.querySelector("[data-codemcp-mini-app-root]");\n' > internal/telegram/mini-app-dist/assets/mini-app.js

      - name: Install security tooling
        if: needs.changes.outputs.full == 'true'
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          go install github.com/securego/gosec/v2/cmd/gosec@v2.29.0
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.1
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: Vulnerability scan
        if: needs.changes.outputs.full == 'true'
        run: govulncheck ./...

      - name: Verify tidy module metadata
        if: needs.changes.outputs.full == 'true'
        run: go mod tidy -diff

      - name: Verify modules
        if: needs.changes.outputs.full == 'true'
        run: go mod verify

      - name: Static analysis
        if: needs.changes.outputs.full == 'true'
        run: staticcheck ./...

      - name: Security analysis
        if: needs.changes.outputs.full == 'true'
        run: make security-gosec

      - name: Verify generated presentation contract
        if: needs.changes.outputs.full == 'true'
        run: make check-generated

      - name: Go coverage gate
        if: needs.changes.outputs.full == 'true'
        env:
          CM_CONFIG_DIR: ${{ runner.temp }}/cm-coverage-test
        run: |
          go test -count=1 -coverprofile="${RUNNER_TEMP}/coverage.out" ./...
          coverage=$(go tool cover -func="${RUNNER_TEMP}/coverage.out" | awk '/^total:/ {gsub(/%/, "", $3); print $3}')
          echo "Go coverage: ${coverage}%"
          awk -v coverage="${coverage}" 'BEGIN { if (coverage + 0 < 66.0) { print "Go coverage must be at least 66.0%" > "/dev/stderr"; exit 1 } }'

      - name: Workflow lint
        if: needs.changes.outputs.full == 'true'
        run: actionlint .github/workflows/ci.yml .github/workflows/release.yml

      - name: Installer lint
        if: needs.changes.outputs.full == 'true'
        run: shellcheck install.sh scripts/installer/test-unix.sh scripts/release/build-windows-setup.sh scripts/installer/test-windows-setup.sh scripts/release/verify-windows-setup-payload.sh

  race:
    name: Race test
    runs-on: ubuntu-latest
    needs:
      - changes
    timeout-minutes: 10
    steps:
      - name: Skip heavy checks
        if: needs.changes.outputs.full != 'true'
        run: echo "Documentation-only change; race test skipped."

      - name: Checkout
        if: needs.changes.outputs.full == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        if: needs.changes.outputs.full == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Prepare frontend fixture
        if: needs.changes.outputs.full == 'true'
        run: |
          mkdir -p internal/interface/web/dist internal/telegram/mini-app-dist/assets
          printf '<!doctype html><html><body>CI</body></html>\n' > internal/interface/web/dist/index.html
          printf '<!doctype html><html><head><script src="https://telegram.org/js/telegram-web-app.js?56"></script></head><body><div data-codemcp-mini-app-root>Loading CodeMCP Mini App</div><script type="module" src="/assets/mini-app.js"></script></body></html>\n' > internal/telegram/mini-app-dist/mini-app.html
          printf 'document.querySelector("[data-codemcp-mini-app-root]");\n' > internal/telegram/mini-app-dist/assets/mini-app.js

      - name: Test with race detector
        if: needs.changes.outputs.full == 'true'
        env:
          CM_CONFIG_DIR: ${{ runner.temp }}/cm-go-race-test
        run: go test -count=1 -race ./...

  native:
    name: Native ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    needs:
      - changes
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            runner: ubuntu-latest
            binary: cm
          - name: Windows
            runner: windows-latest
            binary: cm.exe
          - name: macOS
            runner: macos-latest
            binary: cm
    steps:
      - name: Skip heavy checks
        if: needs.changes.outputs.full != 'true'
        run: echo "Documentation-only change; native checks skipped."

      - name: Checkout
        if: needs.changes.outputs.full == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        if: needs.changes.outputs.full == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node
        if: needs.changes.outputs.full == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Prepare frontend fixture
        if: needs.changes.outputs.full == 'true'
        shell: bash
        run: |
          mkdir -p internal/interface/web/dist internal/telegram/mini-app-dist/assets
          printf '<!doctype html><html><body>CI</body></html>\n' > internal/interface/web/dist/index.html
          printf '<!doctype html><html><head><script src="https://telegram.org/js/telegram-web-app.js?56"></script></head><body><div data-codemcp-mini-app-root>Loading CodeMCP Mini App</div><script type="module" src="/assets/mini-app.js"></script></body></html>\n' > internal/telegram/mini-app-dist/mini-app.html
          printf 'document.querySelector("[data-codemcp-mini-app-root]");\n' > internal/telegram/mini-app-dist/assets/mini-app.js

      - name: Validate Unix installer
        if: needs.changes.outputs.full == 'true' && runner.os != 'Windows'
        run: sh scripts/installer/test-unix.sh

      - name: Validate Windows setup wrapper
        if: needs.changes.outputs.full == 'true' && runner.os == 'Linux'
        run: sh scripts/installer/test-windows-setup.sh

      - name: Validate PowerShell installer
        if: needs.changes.outputs.full == 'true' && runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/installer/test-powershell.ps1

      - name: Validate Windows PowerShell installer
        if: needs.changes.outputs.full == 'true' && runner.os == 'Windows'
        shell: powershell
        run: ./scripts/installer/test-powershell.ps1

      - name: Install NSIS for Windows setup smoke
        if: needs.changes.outputs.full == 'true' && runner.os == 'Windows'
        shell: pwsh
        run: choco install nsis -y --no-progress

      - name: Validate Windows NSIS setup
        if: needs.changes.outputs.full == 'true' && runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/installer/test-windows-setup.ps1

      - name: Local install smoke
        if: needs.changes.outputs.full == 'true'
        run: make install-local ARGS="--skip-frontend"

      - name: Test
        if: needs.changes.outputs.full == 'true'
        env:
          CM_CONFIG_DIR: ${{ runner.temp }}/cm-go-test
        run: go test -count=1 ./...

      - name: Vet
        if: needs.changes.outputs.full == 'true'
        run: go vet ./...

      - name: Build
        if: needs.changes.outputs.full == 'true'
        run: go build -trimpath -o ./dist-smoke/${{ matrix.binary }} ./

      - name: Verify source build release boundary
        if: needs.changes.outputs.full == 'true'
        run: go run ./scripts/release/verify --binary ./dist-smoke/${{ matrix.binary }} --expect-telemetry absent

      - name: Runtime smoke
        if: needs.changes.outputs.full == 'true'
        run: make release-smoke BINARY=./dist-smoke/${{ matrix.binary }}

  cross-build:
    name: Cross build ${{ matrix.os }}/${{ matrix.arch }}
    runs-on: ubuntu-latest
    needs:
      - changes
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - os: linux
            arch: amd64
          - os: linux
            arch: arm64
          - os: windows
            arch: amd64
          - os: windows
            arch: arm64
          - os: darwin
            arch: amd64
          - os: darwin
            arch: arm64
    steps:
      - name: Skip heavy checks
        if: needs.changes.outputs.full != 'true'
        run: echo "Documentation-only change; cross build skipped."

      - name: Checkout
        if: needs.changes.outputs.full == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        if: needs.changes.outputs.full == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Prepare frontend fixture
        if: needs.changes.outputs.full == 'true'
        run: |
          mkdir -p internal/interface/web/dist internal/telegram/mini-app-dist/assets
          printf '<!doctype html><html><body>CI</body></html>\n' > internal/interface/web/dist/index.html
          printf '<!doctype html><html><head><script src="https://telegram.org/js/telegram-web-app.js?56"></script></head><body><div data-codemcp-mini-app-root>Loading CodeMCP Mini App</div><script type="module" src="/assets/mini-app.js"></script></body></html>\n' > internal/telegram/mini-app-dist/mini-app.html
          printf 'document.querySelector("[data-codemcp-mini-app-root]");\n' > internal/telegram/mini-app-dist/assets/mini-app.js

      - name: Build
        if: needs.changes.outputs.full == 'true'
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 0
        run: go build -trimpath -ldflags "-s -w" -o cm ./
