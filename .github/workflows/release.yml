name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  actions: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-setup:
    name: Build Windows setup
    runs-on: windows-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Build frontend
        shell: pwsh
        run: |
          pnpm --dir frontend install --frozen-lockfile
          pnpm --dir frontend build

      - name: Build canonical Windows binary
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: 'v2.18.0'
          args: build --clean --single-target
        env:
          GOOS: windows
          GOARCH: amd64
          TELEMETRY_ENDPOINT: ${{ secrets.TELEMETRY_ENDPOINT }}

      - name: Install pinned Inno Setup compiler
        shell: pwsh
        run: |
          $compiler = & ./scripts/release/install-inno-setup.ps1 `
            -InstallRoot (Join-Path $env:RUNNER_TEMP 'inno-release')
          "INNO_ISCC=$compiler" >> $env:GITHUB_ENV

      - name: Build staged Windows setup
        shell: pwsh
        run: |
          $binaries = @(Get-ChildItem -LiteralPath dist -Recurse -File -Filter cm.exe)
          if ($binaries.Count -ne 1) {
            throw "Expected exactly one canonical Windows cm.exe, found $($binaries.Count)"
          }
          $staging = Join-Path $env:RUNNER_TEMP 'windows-setup-staging'
          & ./scripts/release/build-windows-setup.ps1 `
            -BinaryPath $binaries[0].FullName `
            -Version $env:GITHUB_REF_NAME `
            -OutputDirectory $staging `
            -CompilerPath $env:INNO_ISCC
          if ($LASTEXITCODE -ne 0) {
            throw "Windows setup builder failed with exit code $LASTEXITCODE"
          }

      - name: Upload staged Windows setup
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codemcp-windows-setup-staging
          path: |
            ${{ runner.temp }}/windows-setup-staging/codemcp_windows_amd64_setup.exe
            ${{ runner.temp }}/windows-setup-staging/codemcp_windows_amd64_cm.sha256
          if-no-files-found: error
          retention-days: 1

  release:
    name: Publish release
    needs: windows-setup
    runs-on: ubuntu-24.04
    env:
      PACKAGE_MAINTAINER: "${{ github.repository_owner }} <${{ github.repository_owner_id }}+${{ github.repository_owner }}@users.noreply.github.com>"
    permissions:
      contents: write
      actions: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify tag points to current main
        run: |
          git fetch origin main:refs/remotes/origin/main --no-tags
          main_sha=$(git rev-parse origin/main)
          if [ "${GITHUB_SHA}" != "${main_sha}" ]; then
            echo "::error::Release tag ${GITHUB_REF_NAME} points to ${GITHUB_SHA}, but origin/main is ${main_sha}."
            exit 1
          fi

      - name: Verify CI passed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          conclusion=$(gh run list --workflow CI --commit "${GITHUB_SHA}" --limit 1 --json status,conclusion --jq '.[0] | select(.status == "completed") | .conclusion')
          if [ "${conclusion}" != "success" ]; then
            echo "::error::CI for ${GITHUB_SHA} has not completed successfully."
            exit 1
          fi

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify release repository and module vanity
        env:
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          go run ./scripts/release/verify \
            --repository-root . \
            --github-repository "${RELEASE_REPOSITORY}" \
            --vanity-url "https://go.mewis.me/codemcp?go-get=1"

      - name: Verify released-state cutover fixture
        env:
          CM_CONFIG_DIR: ${{ runner.temp }}/cm-release-migration
        run: go test -count=1 ./internal/migration/released024 -run '^TestRepresentativeReleasedInstallCutover$'

      - name: Verify product telemetry release metadata
        env:
          TELEMETRY_ENDPOINT: ${{ secrets.TELEMETRY_ENDPOINT }}
        run: go run ./scripts/release/verify --telemetry-endpoint

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Build frontend
        run: |
          pnpm --dir frontend install --frozen-lockfile
          pnpm --dir frontend build

      - name: Build endpoint-less snapshot
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          distribution: goreleaser
          version: 'v2.18.0'
          args: build --snapshot --clean --single-target
        env:
          TELEMETRY_ENDPOINT: ''

      - name: Verify snapshot telemetry boundary
        run: |
          snapshot_binary=$(find dist -type f -name cm -perm -111 -print -quit)
          test -n "${snapshot_binary}"
          go run ./scripts/release/verify --binary "${snapshot_binary}" --expect-telemetry absent

      - name: Download staged Windows setup
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: codemcp-windows-setup-staging
          path: .release-staging/windows-setup

      - name: Verify staged Windows setup inputs
        run: |
          set -eu
          staging=.release-staging/windows-setup
          test -f "${staging}/codemcp_windows_amd64_setup.exe"
          test ! -L "${staging}/codemcp_windows_amd64_setup.exe"
          test -f "${staging}/codemcp_windows_amd64_cm.sha256"
          test ! -L "${staging}/codemcp_windows_amd64_cm.sha256"
          test "$(find "${staging}" -maxdepth 1 -type f | wc -l | tr -d '[:space:]')" = "2"

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v3.1.3'

      - name: Build signed draft release
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          distribution: goreleaser
          version: 'v2.18.0'
          args: release --clean --draft
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEMETRY_ENDPOINT: ${{ secrets.TELEMETRY_ENDPOINT }}

      - name: Verify Windows setup provenance
        run: sh scripts/release/verify-windows-setup-payload.sh .release-staging/windows-setup dist

      - name: Stage Windows setup for local draft verification
        run: cp .release-staging/windows-setup/codemcp_windows_amd64_setup.exe dist/codemcp_windows_amd64_setup.exe

      - name: Verify draft release artifacts
        run: go run ./scripts/release/verify --dist dist --expect-telemetry present

      - name: Verify draft contains one Windows setup
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          count=$(gh release view "${GITHUB_REF_NAME}" --json assets --jq \
            '[.assets[].name | select(. == "codemcp_windows_amd64_setup.exe")] | length')
          if [ "${count}" != "1" ]; then
            echo "::error::Draft release contains ${count} Windows setup assets, want 1."
            exit 1
          fi

      - name: Verify checksum signature
        run: |
          cosign verify-blob \
            --bundle=dist/codemcp_checksums.txt.sigstore.json \
            --certificate-identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/tags/${GITHUB_REF_NAME}" \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
            dist/codemcp_checksums.txt

      - name: Attach package manifests to draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test -f dist/scoop/codemcp.json
          test -f dist/homebrew/Casks/codemcp.rb
          gh release upload "${GITHUB_REF_NAME}" \
            dist/scoop/codemcp.json \
            dist/homebrew/Casks/codemcp.rb \
            --clobber

      - name: Publish verified release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${GITHUB_REF_NAME}" --draft=false --latest

      - name: Trigger package manager sync
        env:
          GH_TOKEN: ${{ secrets.PACKAGE_SYNC_TOKEN }}
        run: |
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::warning::PACKAGE_SYNC_TOKEN is not configured; skipping Homebrew/Scoop sync."
            exit 0
          fi
          payload=$(jq -n \
            --arg name "codemcp" \
            --arg tag "${GITHUB_REF_NAME}" \
            '{event_type:"sync-package",client_payload:{name:$name,tag:$tag}}')
          for repo in homebrew-mew scoop-mew; do
            echo "$payload" | gh api "repos/${{ github.repository_owner }}/${repo}/dispatches" --input -
            echo "Dispatched sync-package to ${{ github.repository_owner }}/${repo} (${GITHUB_REF_NAME})"
          done
