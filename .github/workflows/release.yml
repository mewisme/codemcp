name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  actions: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish release
    runs-on: ubuntu-latest
    env:
      PACKAGE_MAINTAINER: "${{ github.repository_owner }} <${{ github.repository_owner_id }}+${{ github.repository_owner }}@users.noreply.github.com>"
    permissions:
      contents: write
      actions: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify tag points to current main
        run: |
          git fetch origin main:refs/remotes/origin/main --no-tags
          main_sha=$(git rev-parse origin/main)
          if [ "${GITHUB_SHA}" != "${main_sha}" ]; then
            echo "::error::Release tag ${GITHUB_REF_NAME} points to ${GITHUB_SHA}, but origin/main is ${main_sha}."
            exit 1
          fi

      - name: Verify CI passed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          conclusion=$(gh run list --workflow CI --commit "${GITHUB_SHA}" --limit 1 --json status,conclusion --jq '.[0] | select(.status == "completed") | .conclusion')
          if [ "${conclusion}" != "success" ]; then
            echo "::error::CI for ${GITHUB_SHA} has not completed successfully."
            exit 1
          fi

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify release repository and module vanity
        env:
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          go run ./scripts/release-cutover \
            --repository-root . \
            --github-repository "${RELEASE_REPOSITORY}" \
            --vanity-url "https://go.mewis.me/codemcp?go-get=1"

      - name: Verify released-state cutover fixture
        env:
          CM_CONFIG_DIR: ${{ runner.temp }}/cm-release-migration
        run: go test -count=1 ./internal/migration/released024 -run '^TestRepresentativeReleasedInstallCutover$'

      - name: Verify product telemetry release metadata
        env:
          TELEMETRY_ENDPOINT: ${{ vars.TELEMETRY_ENDPOINT }}
        run: go run ./scripts/verify-release-telemetry.go

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Build frontend
        run: |
          pnpm --dir frontend install --frozen-lockfile
          pnpm --dir frontend build

      - name: Install UPX
        uses: crazy-max/ghaction-upx@c83f378efc804f828e988debb88ed6116feb2368 # v4.0.0
        with:
          version: 'v5.2.0'
          install-only: true

      - name: Build endpoint-less snapshot
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          distribution: goreleaser
          version: 'v2.18.0'
          args: build --snapshot --clean --single-target
        env:
          TELEMETRY_ENDPOINT: ''

      - name: Verify snapshot telemetry boundary
        run: |
          snapshot_binary=$(find dist -type f -name cm -perm -111 -print -quit)
          test -n "${snapshot_binary}"
          go run ./scripts/release-cutover --binary "${snapshot_binary}" --expect-telemetry absent

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v3.1.3'

      - name: Release
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          distribution: goreleaser
          version: 'v2.18.0'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEMETRY_ENDPOINT: ${{ vars.TELEMETRY_ENDPOINT }}

      - name: Verify published release artifacts
        run: go run ./scripts/release-cutover --dist dist --expect-telemetry present

      - name: Attach package manifests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test -f dist/scoop/codemcp.json
          test -f dist/homebrew/Casks/codemcp.rb
          gh release upload "${GITHUB_REF_NAME}" \
            dist/scoop/codemcp.json \
            dist/homebrew/Casks/codemcp.rb \
            --clobber

      - name: Trigger package manager sync
        env:
          GH_TOKEN: ${{ secrets.PACKAGE_SYNC_TOKEN }}
        run: |
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::warning::PACKAGE_SYNC_TOKEN is not configured; skipping Homebrew/Scoop sync."
            exit 0
          fi
          payload=$(jq -n \
            --arg name "codemcp" \
            --arg tag "${GITHUB_REF_NAME}" \
            '{event_type:"sync-package",client_payload:{name:$name,tag:$tag}}')
          for repo in homebrew-mew scoop-mew; do
            echo "$payload" | gh api "repos/${{ github.repository_owner }}/${repo}/dispatches" --input -
            echo "Dispatched sync-package to ${{ github.repository_owner }}/${repo} (${GITHUB_REF_NAME})"
          done
